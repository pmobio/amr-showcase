<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tencent AI for Life Sciences Lab - AI-powered Platform for Combating AMR </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            padding: 20px;
        }

        .slide-image {
            max-width: 100%;
            max-height: calc(100vh - 120px);
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 150, 255, 0.15);
        }

        .slide-number {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #4a9eff;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .swiper-pagination {
            bottom: 20px !important;
        }

        .swiper-pagination-bullet {
            background: #4a9eff;
            opacity: 0.3;
            width: 8px;
            height: 8px;
            margin: 0 4px !important;
        }

        .swiper-pagination-bullet-active {
            opacity: 1;
            width: 24px;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-text {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .logo-sub {
            color: #4a9eff;
            font-size: 11px;
            opacity: 0.8;
        }

        .page-indicator {
            color: #4a9eff;
            font-size: 13px;
            font-weight: 500;
            background: rgba(74, 158, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(74, 158, 255, 0.2);
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(74, 158, 255, 0.2);
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: #4a9eff;
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.8;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hint {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        .hint-icon {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
    </div>

    <div class="header">
        <div class="logo">
            <div>
                <div class="logo-text">Tencent</div>
                <div class="logo-sub">AI for Life Sciences Lab</div>
            </div>
        </div>
        <div class="page-indicator" id="pageIndicator">1 / 9</div>
    </div>

    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="Page1.png" alt="Page 1" class="slide-image" loading="eager">
            </div>
            <div class="swiper-slide">
                <img src="Page2.png" alt="Page 2" class="slide-image" loading="lazy">
            </div>
            <div class="swiper-slide">
                <img src="Page3.png" alt="Page 3" class="slide-image" loading="lazy">
            </div>
            <div class="swiper-slide">
                <img src="Page4.png" alt="Page 4" class="slide-image" loading="lazy">
            </div>
            <div class="swiper-slide">
                <img src="Page5.png" alt="Page 5" class="slide-image" loading="lazy">
            </div>
            <div class="swiper-slide">
                <img src="Page6.png" alt="Page 6" class="slide-image" loading="lazy">
            </div>
            <div class="swiper-slide">
                <img src="Page7.png" alt="Page 7" class="slide-image" loading="lazy">
            </div>
            <div class="swiper-slide">
                <img src="Page8.png" alt="Page 8" class="slide-image" loading="lazy">
            </div>
            <div class="swiper-slide">
                <img src="Page9.png" alt="Page 9" class="slide-image" loading="lazy">
            </div>
        </div>
        <div class="swiper-pagination"></div>
    </div>

    <div class="hint">
        <svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
        </svg>
        左右滑动切换
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // Initialize Swiper
        const swiper = new Swiper('.swiper', {
            direction: 'horizontal',
            loop: false,
            grabCursor: true,
            effect: 'slide',
            speed: 400,
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
                dynamicBullets: true,
            },
            keyboard: {
                enabled: true,
            },
            on: {
                slideChange: function () {
                    document.getElementById('pageIndicator').textContent = 
                        (this.activeIndex + 1) + ' / ' + this.slides.length;
                },
            },
        });

        // Hide loading after images load
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        });

        // Hide hint after first interaction
        let hintHidden = false;
        document.querySelector('.swiper').addEventListener('touchstart', function() {
            if (!hintHidden) {
                document.querySelector('.hint').style.opacity = '0';
                hintHidden = true;
            }
        });
    </script>
</body>
</html>
